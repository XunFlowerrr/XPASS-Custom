[project]
name = "xpass-simple"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "open-clip-torch>=3.3.0",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Only the orchestrating machine needs this. Keeping it out of the default
# groups means `uv sync` on a studio never installs it.
fleet = [
    "lightning-sdk>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
